# SDK Security Permission Rules
# ================================
# Permission levels:
#   L0 (DIRECT)       — read-only / reversible operations, auto-allow
#   L1 (SUDO_REQUIRED) — requires user confirmation for system-modifying ops
#   L2 (DISALLOWED)    — sensitive / dangerous operations, directly denied
#
# Matching order: exact match → wildcard match → default L0

servers:
  # ---- Read-only / reversible tools (L0: auto-allow) ----
  kylin_sdk_server:
    "*": L0
  kylin_server:
    "*": L0
  bdmap_server:
    "*": L0
  gdmap_server:
    "*": L0
  api_server:
    "*": L0
  local_server:
    "*": L0
  filesystem_server:
    "*": L0

  # ---- Desktop control (L2: completely disallowed) ----
  kylin_desktop_control_server:
    "*": L2

  # ---- Toolkit (SDK-first closed-loop tools) ----
  # L0: read-only / reversible
  # L1: system-modifying — requires user confirmation (approval gate)
  # L2: never auto-allow (control_panel reserved for desktop_control SDK)
  toolkit:
    volume: L0
    screenshot: L0
    notify: L0
    directory: L0
    wallpaper: L1
    bluetooth: L1
    wifi: L1
    touchpad: L1
    music: L1
    app: L1
    timezone: L1
    datetime: L1
    sleep: L1
    power: L1
    screensaver: L1
    power_idle: L1
    control_panel: L2
    # New SDK tools
    netstatus: L0
    diskinfo: L0
    process_list: L0
    battery_info: L0
    proxy: L1
    dns: L1
    process_kill: L1
    power_plan: L1

dsl_actions:
  # ---- L0: Read-only / info queries ----
  "show versioninfo": L0
  "show kernelinfo": L0
  "show cpuinfo": L0
  "do showmemoryusagepercentageoverall": L0
  "do getfreediskspace": L0
  "do getsystemloadaverage": L0
  "show ifconfiginfo": L0
  "do getbatterychargelevel": L0
  "do getbatterycyclecount": L0
  "do showgpuinformation": L0
  "do getfanspeedsummary": L0
  "do gethostname": L0
  "do getsystemarchitecture": L0
  "do showsystemuptime": L0
  "do showsystemboottime": L0
  "do getsystemlocale": L0
  "screenshot": L0
  "areascreenshot": L0
  "windowscreenshot": L0

  # ---- L1: Reversible / confirmable actions ----
  "open volume": L1
  "close volume": L1
  "open maxvolume": L1
  "open minvolume": L1
  "open bluetooth": L1
  "close bluetooth": L1
  "open network": L1
  "close network": L1
  "open touchpad": L1
  "close touchpad": L1
  "play music": L1
  "pause": L1
  "open browser": L1
  "open filemanager": L1
  "open terminal": L1
  "open calculator": L1
  "set background": L1
  "set timezone": L1
  "suspend": L1
  "show wifilist": L0
  "show proxy": L0
  "show dns": L0
  "show processlist": L0
  "show batteryinfo": L0
  "show diskinfo": L0
  "connect wifi": L1
  "disconnect wifi": L1
  "set proxy": L1
  "set dns": L1
  "kill process": L1
  "set powerplan": L1

  # ---- L2: Disallowed ----
  # reboot/shutdown 保持 L2（actuator/shell 兜底路径禁止；SDK power 工具走 toolkit=L1）
  "reboot": L2
  "shutdown": L2
  "rm_root": L2
  "mkfs": L2
  "dd_write": L2
  "*": L0
